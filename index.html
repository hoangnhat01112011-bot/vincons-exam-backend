<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh Giá Trình Độ Bậc Thợ - Vincons</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Check login immediately
        let loggedInUser = JSON.parse(localStorage.getItem('vincons_logged_in_user'));
        if (!loggedInUser) {
            loggedInUser = { name: "", username: "", role: "candidate" };
            localStorage.setItem('vincons_logged_in_user', JSON.stringify(loggedInUser));
        }
    </script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">VC</div>
            <div class="logo-text">
                <h1>Vincons</h1>
                <p>BCH Hạ Long Xanh</p>
            </div>
        </div>
        <div class="header-nav" style="display: flex; align-items: center; gap: 15px;">
            <span id="userInfoDisplay" style="font-size: 13px; font-weight: 700; color: var(--primary);"></span>
            <a href="kpi.html" class="nav-link">📊 Quản lý KPI</a>
            <a href="bao_cao_san_luong.html" class="nav-link">✍️ Báo cáo sản lượng</a>
            <a href="history.html" class="nav-link">📋 Lịch sử bài thi</a>
            <a href="login.html" class="nav-link" id="navLoginLink">🔑 Đăng nhập Giám thị/Admin</a>
            <button onclick="handleLogout()" id="btnLogout" class="btn btn-secondary btn-sm" style="padding: 6px 12px; font-size: 12px;">Đăng xuất</button>
        </div>
    </header>

    <main>
        <div class="card">
            <h2 class="card-title">Đăng Ký Dự Thi</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <label for="candidateName">Họ và tên thí sinh (*)</label>
                    <input type="text" id="candidateName" class="form-control" placeholder="Nhập họ và tên đầy đủ" required>
                </div>
                
                <div class="form-group">
                    <label for="candidateId">Số báo danh / SĐT (*)</label>
                    <input type="text" id="candidateId" class="form-control" placeholder="Nhập SBD hoặc Số điện thoại" required>
                </div>

                <div class="form-group">
                    <label for="candidateJob">Tổ thợ / Vị trí ứng tuyển (*)</label>
                    <select id="candidateJob" class="form-control" required>
                        <option value="" disabled selected>-- Chọn vị trí --</option>
                        <option value="Thợ Xây dựng (Nề)">Thợ Xây dựng (Nề)</option>
                        <option value="Thợ Điện nước (M&E)">Thợ Điện nước (M&E)</option>
                        <option value="Thợ Sắt cốt thép">Thợ Sắt cốt thép</option>
                        <option value="Thợ Mộc cốp pha">Thợ Mộc cốp pha</option>
                        <option value="Kỹ sư Giám sát (T7, T8)">Kỹ sư Giám sát (T7, T8)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="examType">Phần thi đăng ký (*)</label>
                    <select id="examType" class="form-control" required onchange="toggleExamSetGroup(this.value)">
                        <option value="" disabled selected>-- Chọn phần thi --</option>
                        <option value="Lý thuyết">Thi Lý thuyết (Thời gian: 30 phút - 30 câu)</option>
                        <option value="Thực hành">Thi Thực hành (Thời gian: 60 phút)</option>
                    </select>
                </div>

                <div class="form-group" id="examSetGroup" style="display: none;">
                    <label for="examSet">Bộ đề thi Lý thuyết (*)</label>
                    <select id="examSet" class="form-control">
                        <option value="all">Ngẫu nhiên 30 câu (Từ ngân hàng 150 câu 5 bộ đề)</option>
                        <option value="Đề số 01">Đề số 01 - Đề thi trắc nghiệm điện (30 câu)</option>
                        <option value="Đề số 02">Đề số 02 - Đề thi trắc nghiệm điện (30 câu)</option>
                        <option value="Đề số 03">Đề số 03 - Đề thi trắc nghiệm điện (30 câu)</option>
                        <option value="Đề số 04">Đề số 04 - Đề thi trắc nghiệm điện (30 câu)</option>
                        <option value="Đề số 05">Đề số 05 - Đề thi trắc nghiệm điện (30 câu)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-accent btn-block" style="margin-top: 10px;">Bắt đầu làm bài</button>
            </form>
        </div>
    </main>

    <footer>
        &copy; 2026 Vincons - Ban Chỉ Huy Dự Án Hạ Long Xanh. All rights reserved.
    </footer>

    <script>
        // Display user info and populate fields
        if (loggedInUser) {
            const roleText = loggedInUser.role === 'admin' ? 'Giám thị' : 'Thí sinh';
            document.getElementById('userInfoDisplay').textContent = loggedInUser.name ? `${loggedInUser.name} (${roleText})` : `Thí sinh`;
            if (loggedInUser.name) {
                document.getElementById('candidateName').value = loggedInUser.name;
            }
            if (loggedInUser.username) {
                document.getElementById('candidateId').value = loggedInUser.username;
            }
            
            // Toggle login/logout view
            if (loggedInUser.username && loggedInUser.username !== "thi_sinh") {
                const loginLink = document.getElementById('navLoginLink');
                if (loginLink) loginLink.style.display = 'none';
                const logoutBtn = document.getElementById('btnLogout');
                if (logoutBtn) logoutBtn.style.display = 'block';
            } else {
                const loginLink = document.getElementById('navLoginLink');
                if (loginLink) loginLink.style.display = 'block';
                const logoutBtn = document.getElementById('btnLogout');
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }
 
        function handleLogout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất tài khoản?')) {
                localStorage.removeItem('vincons_logged_in_user');
                localStorage.removeItem('vincons_candidate');
                localStorage.removeItem('vincons_answers');
                localStorage.removeItem('vincons_time_left');
                localStorage.removeItem('vincons_active_questions');
                window.location.href = 'login.html';
            }
        }

        function toggleExamSetGroup(val) {
            const group = document.getElementById('examSetGroup');
            if (group) {
                group.style.display = (val === 'Lý thuyết') ? 'block' : 'none';
            }
        }

        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('candidateName').value.trim();
            const id = document.getElementById('candidateId').value.trim();
            const job = document.getElementById('candidateJob').value;
            const examType = document.getElementById('examType').value;
            const examSet = document.getElementById('examSet') ? document.getElementById('examSet').value : 'all';
            
            if (!name || !id || !job || !examType) {
                alert('Vui lòng điền đầy đủ các thông tin bắt buộc.');
                return;
            }
            
            // Sync candidate info to logged in user so that other pages display correctly
            loggedInUser.name = name;
            loggedInUser.username = id;
            localStorage.setItem('vincons_logged_in_user', JSON.stringify(loggedInUser));

            // Save candidate info to localStorage
            const candidateInfo = {
                name: name,
                id: id,
                job: job,
                examType: examType,
                examSet: examSet,
                startTime: new Date().getTime()
            };
            
            localStorage.setItem('vincons_candidate', JSON.stringify(candidateInfo));
            
            // Redirect to exam page
            window.location.href = 'exam.html';
        });
        
        // Clean up any old exam state on reload
        localStorage.removeItem('vincons_answers');
        localStorage.removeItem('vincons_time_left');
    </script>
</body>
</html>
