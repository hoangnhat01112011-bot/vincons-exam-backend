<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Hệ thống - Vincons</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/config.js?v=4"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">VC</div>
            <div class="logo-text">
                <h1>Vincons</h1>
                <p>BCH Hạ Long Xanh</p>
            </div>
        </div>
        <div class="header-nav" style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="nav-link">🏠 Trang chủ</a>
            <a href="history.html" class="nav-link">📋 Xem lịch sử thi</a>
            <a href="admin.html" class="nav-link active">👑 Quản trị Admin</a>
            <button onclick="handleLogout()" class="btn btn-secondary btn-sm" style="padding: 6px 12px; font-size: 12px;">Đăng xuất</button>
        </div>
    </header>

    <main>
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="text-center" style="margin-bottom: 20px;">
                <h2 style="color: var(--primary);">⚙️ CÀI ĐẶT MÃ CA THI</h2>
                <p style="color: #7f8c8d; font-size: 14px;">Thiết lập mã PIN bí mật cho ngày thi. Chỉ thí sinh nào biết mã này mới có thể đăng nhập vào làm bài.</p>
            </div>

                                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div style="flex: 1; background: #fff9c4; border: 2px solid #f1c40f; border-radius: 8px; padding: 15px; text-align: center;">
                            <h4 style="color: #d35400; margin-top: 0; font-size: 14px;">MÃ CA NÂNG BẬC/ĐỊNH KỲ</h4>
                            <div id="currentExamPin" style="font-size: 28px; font-weight: bold; color: #e67e22; letter-spacing: 3px;">----</div>
                        </div>
                        <div style="flex: 1; background: #e0f7fa; border: 2px solid #00bcd4; border-radius: 8px; padding: 15px; text-align: center;">
                            <h4 style="color: #00838f; margin-top: 0; font-size: 14px;">MÃ CA TUYỂN DỤNG</h4>
                            <div id="currentExamPinTuyendung" style="font-size: 28px; font-weight: bold; color: #0097a6; letter-spacing: 3px;">----</div>
                        </div>
                    </div>
            <form id="settingsForm" onsubmit="handleUpdatePin(event)" style="border-top: 1px solid #eee; padding-top: 20px;">
                <div class="form-group">
                    <label for="newExamPin">Mã Ca Nâng Bậc/Định Kỳ Mới</label>
                    <input type="text" id="newExamPin" class="form-control" placeholder="Mã 8 chữ số (VD: 68686868)" minlength="8" maxlength="8">
                </div>
                <div class="form-group">
                    <label for="newExamPinTuyendung">Mã Ca Tuyển Dụng Mới</label>
                    <input type="text" id="newExamPinTuyendung" class="form-control" placeholder="Mã 8 chữ số (VD: 88888888)" minlength="8" maxlength="8">
                </div>

                <div class="form-group">
                    <label for="reviewLimit">Số câu hỏi Chế độ Ôn tập</label>
                    <input type="number" id="reviewLimit" class="form-control" placeholder="Mặc định: 10" min="1" max="150">
                </div>

                <div class="form-group" style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px;">
                    <label for="adminConfirmPin">Xác nhận PIN Giám thị (*)</label>
                    <input type="password" id="adminConfirmPin" class="form-control" placeholder="Nhập mã Giám thị (VINCONS2026) để lưu thay đổi" required>
                </div>

                <button type="submit" id="btnUpdate" class="btn btn-primary btn-block">Lưu Mã Ca Thi</button>
            </form>
        </div>
    </main>

    <script>
        function handleLogout() {
            if (confirm('Bạn có chắc chắn muốn thoát quyền Giám thị?')) {
                localStorage.removeItem('vincons_admin');
                window.location.href = 'index.html';
            }
        }

        function loadSettings() {
            document.getElementById('currentExamPin').textContent = "Đang tải...";
            CONFIG.apiCall('/api/auth/get-settings')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && data.data) {
                        document.getElementById('currentExamPin').textContent = data.data.exam_pin || "68686868";
                        document.getElementById('currentExamPinTuyendung').textContent = data.data.exam_pin_tuyendung || "88888888";
                        document.getElementById('newExamPin').value = data.data.exam_pin || "68686868";
                        document.getElementById('newExamPinTuyendung').value = data.data.exam_pin_tuyendung || "88888888";
                        document.getElementById('reviewLimit').value = data.data.review_limit || 10;
                    } else {
                        document.getElementById('currentExamPin').textContent = "68686868";
                        document.getElementById('currentExamPinTuyendung').textContent = "88888888";
                    }
                })
                .catch(err => {
                    document.getElementById('currentExamPin').textContent = "LỖI";
                });
        }

        function handleUpdatePin(e) {
            e.preventDefault();
            const newPin = document.getElementById('newExamPin').value.trim();
            const newPinTuyendung = document.getElementById('newExamPinTuyendung').value.trim();
            const reviewLimit = document.getElementById('reviewLimit').value.trim();
            const adminPin = document.getElementById('adminConfirmPin').value.trim().toUpperCase();

            if (!adminPin) {
                alert('Vui lòng nhập Mã Giám thị để xác nhận.');
                return;
            }

            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.textContent = "Đang lưu...";
            
            const payload = { admin_pin: adminPin };
            if (newPin) payload.exam_pin = newPin;
            if (newPinTuyendung) payload.exam_pin_tuyendung = newPinTuyendung;
            if (reviewLimit) payload.review_limit = parseInt(reviewLimit);

            CONFIG.apiCall('/api/auth/set-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('✅ Đã cập nhật Mã Ca Thi thành công!');
                    document.getElementById('settingsForm').reset();
                    loadSettings();
                } else {
                    alert('❌ ' + (data.message || 'Lỗi: Mã Giám thị không đúng!'));
                }
            })
            .catch(err => {
                alert('❌ Lỗi kết nối hệ thống.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = "Lưu Mã Ca Thi";
            });
        }

        // Init
        loadSettings();
    </script>
</body>
</html>
