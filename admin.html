<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Hệ thống - Vincons</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/config.js"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">VC</div>
            <div class="logo-text">
                <h1>Vincons</h1>
                <p>BCH Hạ Long Xanh</p>
            </div>
        </div>
        <div class="header-nav" style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="nav-link">🏠 Trang chủ</a>
            <a href="history.html" class="nav-link">📋 Xem lịch sử thi</a>
            <a href="admin.html" class="nav-link active">👑 Quản trị Admin</a>
            <button onclick="handleLogout()" class="btn btn-secondary btn-sm" style="padding: 6px 12px; font-size: 12px;">Đăng xuất</button>
        </div>
    </header>

    <main>
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="text-center" style="margin-bottom: 20px;">
                <h2 style="color: var(--primary);">⚙️ CÀI ĐẶT MÃ CA THI</h2>
                <p style="color: #7f8c8d; font-size: 14px;">Thiết lập mã PIN bí mật cho ngày thi. Chỉ thí sinh nào biết mã này mới có thể đăng nhập vào làm bài.</p>
            </div>

            <div style="background: rgba(241, 196, 15, 0.1); border: 1px solid #f1c40f; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
                <h3 style="color: #d35400; margin-top: 0; margin-bottom: 15px;">MÃ CA THI HIỆN TẠI</h3>
                <div id="currentExamPin" style="font-size: 48px; font-weight: 900; letter-spacing: 15px; color: var(--accent);">
                    ----
                </div>
            </div>

            <form id="settingsForm" onsubmit="handleUpdatePin(event)" style="border-top: 1px solid #eee; padding-top: 20px;">
                <div class="form-group">
                    <label for="newExamPin">Mã Ca Thi Mới</label>
                    <input type="text" id="newExamPin" class="form-control" placeholder="Nhập mã mới (ví dụ: 1234, 8888)">
                </div>

                <div class="form-group">
                    <label for="reviewLimit">Số câu hỏi Chế độ Ôn tập</label>
                    <input type="number" id="reviewLimit" class="form-control" placeholder="Mặc định: 10" min="1" max="150">
                </div>

                <div class="form-group" style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px;">
                    <label for="adminConfirmPin">Xác nhận PIN Giám thị (*)</label>
                    <input type="password" id="adminConfirmPin" class="form-control" placeholder="Nhập mã Giám thị (VINCONS2026) để lưu thay đổi" required>
                </div>

                <button type="submit" id="btnUpdate" class="btn btn-primary btn-block">Lưu Mã Ca Thi</button>
            </form>

            <div style="margin-top: 40px; border-top: 2px solid #3498db; padding-top: 20px;">
                <h3 style="color: #2980b9; margin-top: 0; margin-bottom: 15px; font-size: 16px;">🤖 TẠO CÂU HỎI BẰNG AI (QWEN 2.5)</h3>
                <form id="aiGenerateForm" onsubmit="handleGenerateQuestions(event)">
                    <div class="form-group">
                        <label for="aiTopic">Chủ đề / Yêu cầu</label>
                        <input type="text" id="aiTopic" class="form-control" placeholder="Ví dụ: Quy tắc an toàn điện" required>
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label for="aiCount">Số lượng câu</label>
                            <input type="number" id="aiCount" class="form-control" placeholder="5" min="1" max="20" required value="5">
                        </div>
                        <div style="flex: 2;">
                            <label for="aiCategory">Danh mục</label>
                            <input type="text" id="aiCategory" class="form-control" placeholder="Lý thuyết - Thợ điện" required>
                        </div>
                        <div style="flex: 2;">
                            <label for="aiExamSet">Mã đề</label>
                            <input type="text" id="aiExamSet" class="form-control" placeholder="Đề số 01" required>
                        </div>
                    </div>
                    <button type="submit" id="btnGenerate" class="btn btn-primary btn-block" style="background: #27ae60; border-color: #27ae60;">Tạo câu hỏi</button>
                </form>

                <div id="aiPreview" style="display: none; margin-top: 20px;">
                    <h4 style="color: #d35400; margin-bottom: 10px;">Xem trước câu hỏi:</h4>
                    <div id="aiPreviewContent" style="background: #f9f9f9; padding: 15px; border-radius: 5px; font-size: 13px; max-height: 300px; overflow-y: auto; border: 1px solid #ddd; margin-bottom: 15px; text-align: left;"></div>
                    <button id="btnSaveQuestions" onclick="handleSaveQuestions()" class="btn btn-primary btn-block" style="background: #e67e22; border-color: #e67e22;">Lưu vào Ngân hàng câu hỏi</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function handleLogout() {
            if (confirm('Bạn có chắc chắn muốn thoát quyền Giám thị?')) {
                localStorage.removeItem('vincons_admin');
                window.location.href = 'index.html';
            }
        }

        function loadSettings() {
            document.getElementById('currentExamPin').textContent = "Đang tải...";
            CONFIG.apiCall('/api/auth/get-settings')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && data.data) {
                        document.getElementById('currentExamPin').textContent = data.data.exam_pin || "6868";
                        document.getElementById('newExamPin').value = data.data.exam_pin || "6868";
                        document.getElementById('reviewLimit').value = data.data.review_limit || 10;
                    } else {
                        document.getElementById('currentExamPin').textContent = "6868";
                    }
                })
                .catch(err => {
                    document.getElementById('currentExamPin').textContent = "LỖI";
                });
        }

        function handleUpdatePin(e) {
            e.preventDefault();
            const newPin = document.getElementById('newExamPin').value.trim();
            const reviewLimit = document.getElementById('reviewLimit').value.trim();
            const adminPin = document.getElementById('adminConfirmPin').value.trim().toUpperCase();

            if (!adminPin) {
                alert('Vui lòng nhập Mã Giám thị để xác nhận.');
                return;
            }

            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.textContent = "Đang lưu...";
            
            const payload = { admin_pin: adminPin };
            if (newPin) payload.exam_pin = newPin;
            if (reviewLimit) payload.review_limit = parseInt(reviewLimit);

            CONFIG.apiCall('/api/auth/set-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('✅ Đã cập nhật Mã Ca Thi thành công!');
                    document.getElementById('settingsForm').reset();
                    loadSettings();
                } else {
                    alert('❌ ' + (data.message || 'Lỗi: Mã Giám thị không đúng!'));
                }
            })
            .catch(err => {
                alert('❌ Lỗi kết nối hệ thống.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = "Lưu Mã Ca Thi";
            });
        }

        // Init
        loadSettings();

        // --- AI Question Generation Logic ---
        let generatedQuestions = [];

        function handleGenerateQuestions(e) {
            e.preventDefault();
            const topic = document.getElementById('aiTopic').value.trim();
            const count = parseInt(document.getElementById('aiCount').value) || 5;
            const category = document.getElementById('aiCategory').value.trim();
            const examSet = document.getElementById('aiExamSet').value.trim();

            const btn = document.getElementById('btnGenerate');
            btn.disabled = true;
            btn.textContent = "Đang tạo... (Vui lòng chờ AI khoảng 10-30s)";
            document.getElementById('aiPreview').style.display = 'none';

            CONFIG.apiCall('/api/admin/generate-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, count, category, examSet })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.questions) {
                    generatedQuestions = data.questions;
                    document.getElementById('aiPreviewContent').innerHTML = generatedQuestions.map((q, i) => 
                        `<div style="margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #ccc;">
                            <strong style="color: #2980b9;">Câu ${i+1}:</strong> ${q.question}<br>
                            <div style="margin-top: 5px;">
                                ${q.options.map((opt, j) => `<div style="${j === q.correct_index ? 'color:green;font-weight:bold;' : 'color:#555;'}">- ${opt} ${j === q.correct_index ? '✓' : ''}</div>`).join('')}
                            </div>
                        </div>`
                    ).join('');
                    document.getElementById('aiPreview').style.display = 'block';
                } else {
                    alert('❌ Lỗi: ' + (data.message || 'Không tạo được câu hỏi. Kiểm tra Ollama.'));
                }
            })
            .catch(err => {
                alert('❌ Lỗi kết nối hệ thống khi gọi AI.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = "Tạo câu hỏi";
            });
        }

        function handleSaveQuestions() {
            if (!generatedQuestions.length) return;
            const adminPin = prompt('Nhập mã Giám thị (VINCONS2026) để xác nhận lưu:');
            if (!adminPin) return;

            const btn = document.getElementById('btnSaveQuestions');
            btn.disabled = true;
            btn.textContent = "Đang lưu...";

            CONFIG.apiCall('/api/admin/save-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pin: adminPin.toUpperCase(), questions: generatedQuestions })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('✅ Đã lưu ' + generatedQuestions.length + ' câu hỏi vào ngân hàng!');
                    generatedQuestions = [];
                    document.getElementById('aiPreview').style.display = 'none';
                    document.getElementById('aiGenerateForm').reset();
                } else {
                    alert('❌ ' + (data.message || 'Lỗi: Mã Giám thị không đúng!'));
                }
            })
            .catch(err => alert('❌ Lỗi kết nối hệ thống khi lưu câu hỏi.'))
            .finally(() => {
                btn.disabled = false;
                btn.textContent = "Lưu vào Ngân hàng câu hỏi";
            });
        }
    </script>
</body>
</html>
