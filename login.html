<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Giám thị - Vincons</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/config.js"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body class="auth-page">
    <header>
        <div class="logo-container" ondblclick="configureServer()" title="Nhấn đúp để cấu hình máy chủ" style="cursor: pointer;">
            <div class="logo-icon">VC</div>
            <div class="logo-text">
                <h1>Vincons</h1>
                <p>BCH Hạ Long Xanh</p>
            </div>
        </div>
        <div class="header-nav" style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="nav-link">🏠 Quay lại Trang chủ</a>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header text-center">
                    <div class="logo-icon mx-auto" style="margin-bottom: 10px;">👑</div>
                    <h2 class="card-title">CỔNG QUẢN TRỊ VIÊN</h2>
                    <p class="text-muted">Đăng nhập dành cho Giám thị / Quản lý</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="adminPin">Mã Giám Thị (PIN) (*)</label>
                        <div class="password-toggle-container">
                            <input type="password" id="adminPin" class="form-control" placeholder="Nhập mã PIN quản trị" required>
                            <span class="password-toggle" onclick="togglePassword('adminPin')">👁️</span>
                        </div>
                    </div>
                    
                    <button type="submit" id="btnLogin" class="btn btn-primary btn-block" style="margin-top: 15px; font-weight: bold; font-size: 16px;">
                        ĐĂNG NHẬP QUẢN TRỊ
                    </button>
                    
                    <div style="margin-top: 20px; text-align: center; font-size: 13px; color: #7f8c8d;">
                        Thí sinh dự thi vui lòng quay lại <a href="index.html" style="color: var(--primary); font-weight: bold;">Trang chủ</a> để làm bài.
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        function configureServer() {
            let currentIp = localStorage.getItem('api_base_url') || CONFIG.API_BASE_URL;
            let newIp = prompt("Cấu hình địa chỉ Máy chủ (VD: http://192.168.1.5:8000). Để trống để dùng mặc định:", currentIp);
            if (newIp !== null) {
                if (newIp.trim() === "") {
                    localStorage.removeItem('api_base_url');
                } else {
                    localStorage.setItem('api_base_url', newIp.trim());
                }
                alert("Đã cập nhật máy chủ. Vui lòng tải lại trang.");
                window.location.reload();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('adminPin').value.trim().toUpperCase();
            if (!pin) return;

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = 'Đang xác thực...';

            CONFIG.apiCall('/api/auth/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: pin })
            })
            .then(async res => {
                const data = await res.json();
                if (data.status === 'success') {
                    localStorage.setItem('vincons_admin', 'true');
                    window.location.href = 'admin.html';
                } else {
                    alert('❌ ' + (data.message || 'Mã Giám thị không đúng!'));
                    btn.disabled = false;
                    btn.textContent = 'ĐĂNG NHẬP QUẢN TRỊ';
                }
            })
            .catch(err => {
                alert('❌ Lỗi kết nối hệ thống. Kiểm tra lại mạng hoặc server!');
                btn.disabled = false;
                btn.textContent = 'ĐĂNG NHẬP QUẢN TRỊ';
            });
        }
    </script>
</body>
</html>
