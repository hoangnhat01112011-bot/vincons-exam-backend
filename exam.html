<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Thi Sát Hạch Bậc Thợ - Vincons</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/auth-guard.js"></script>
    <script src="js/config.js"></script>
    <script>
        let candidateUser = JSON.parse(localStorage.getItem('vincons_candidate'));
        
        function handleLogout() {
            if (confirm('Bạn có chắc chắn muốn THOÁT HỦY bài thi đang làm?')) {
                localStorage.removeItem('vincons_candidate');
                localStorage.removeItem('vincons_answers');
                localStorage.removeItem('vincons_time_left');
                localStorage.removeItem('vincons_active_questions');
                window.location.href = 'index.html';
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!candidateUser) {
                window.location.href = 'index.html';
                return;
            }
            const userInfo = document.getElementById('userInfoDisplay');
            if (userInfo) userInfo.textContent = `${candidateUser.name} - ${candidateUser.id}`;
        });
    </script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">VC</div>
            <div class="logo-text">
                <h1>Vincons</h1>
                <p>BCH Hạ Long Xanh</p>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="header-meta" id="examTitle">Bài Thi Sát Hạch</div>
            <span id="userInfoDisplay" style="font-size: 13px; font-weight: 700; color: var(--primary);"></span>
            <button onclick="handleLogout()" class="btn btn-secondary btn-sm" style="padding: 6px 12px; font-size: 12px;">Thoát Bài Thi</button>
        </div>
    </header>

    <main>
        <div class="exam-container" id="examContainer">
            <!-- Left Side: Image Viewer Panel -->
            <div class="image-panel" id="imagePanel">
                <div class="image-header">
                    <span style="font-size: 16px;">🖼️</span>
                    <strong id="imageTitleText">Bản vẽ thiết kế kỹ thuật</strong>
                </div>
                <div class="image-viewport" id="imageViewport" style="text-align: center; background: #fff; padding: 10px; border-radius: 8px; overflow: auto; height: calc(100vh - 200px);">
                    <img id="questionImage" src="" alt="Bản vẽ" style="max-width: 100%; height: auto; border: 1px solid #ddd;">
                </div>
            </div>

            <!-- Right Side: Question Details & Sidebar -->
            <div class="right-panel" style="display: flex; flex-direction: column; gap: 20px;">

            <!-- Left Side: Question Details -->
            <div class="question-panel">
                <div>
                    <div class="question-header" id="questionNumLabel">Câu hỏi 1/30</div>
                    <div class="question-text" id="questionContent">Đang tải câu hỏi...</div>
                    <div class="options-list" id="optionsContainer">
                        <!-- Options generated dynamically -->
                    </div>
                </div>
                
                <div class="navigation-bar">
                    <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()">&larr; Câu trước</button>
                    <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">Câu sau &rarr;</button>
                </div>
            </div>

            <!-- Right Side: Sidebar Status & Timer -->
            <div class="sidebar-panel">
                <div>
                    <div class="grid-title" style="margin-bottom: 12px;">Thí Sinh</div>
                    <div id="candidateDisplayInfo" style="font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--primary);">
                        Đang tải...
                    </div>
                </div>

                <div class="timer-box" id="timerBox">
                    <span style="font-size: 16px;">⏱️</span>
                    <span id="countdownText">30:00</span>
                </div>

                <div>
                    <div class="grid-title" style="margin-bottom: 12px;">Danh Sách Câu Hỏi</div>
                    <div class="questions-grid" id="questionsGrid">
                        <!-- Grid elements generated dynamically -->
                    </div>
                </div>

                <div class="status-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: var(--primary);"></div>
                        <span>Đã trả lời</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: var(--white); border: 1px solid rgba(0,0,0,0.15);"></div>
                        <span>Chưa trả lời</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="box-shadow: 0 0 0 2px var(--accent); background: var(--white);"></div>
                        <span>Câu hiện tại</span>
                    </div>
                </div>

                <button class="btn btn-accent btn-block" style="margin-top: 10px;" onclick="confirmSubmit()">Nộp Bài Thi</button>
            </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Vincons - Ban Chỉ Huy Dự Án Hạ Long Xanh. All rights reserved.
    </footer>

    <!-- Converted Questions File -->
    <script src="questions.js?v=1007"></script>
    <!-- Revit BIM MEP Builder Engine -->
    <script src="js/revit-mep-builder.js"></script>
    <!-- 3D Interactive Building Engine -->
    <script src="js/ikigai-3d-model.js"></script>
    <!-- App Control JavaScript logic -->
    <script src="app.js?v=1001"></script>
</body>
</html>
